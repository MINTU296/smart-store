[project]
name = "store-intelligence"
version = "0.1.0"
description = "Apex Retail offline store intelligence: CCTV-derived events + analytics API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "redis>=5.0",
  "aiosqlite>=0.20",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "structlog>=24.1",
]

[project.optional-dependencies]
pipeline = [
  "ultralytics>=8.1",
  "opencv-python-headless>=4.9",
  "numpy>=1.26",
  "torch>=2.2",
  "torchvision>=0.17",
  "scipy>=1.12",
  "shapely>=2.0",
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=4.1",
  "fakeredis>=2.21",
  "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --tb=short"

[tool.coverage.run]
source = ["app", "pipeline"]
# Exclude integration-only paths whose verification is the docker compose
# smoke test, not pytest (these require live YOLO weights or a WebSocket peer).
omit = [
    "pipeline/run.sh",
    "pipeline/detect.py",
    "app/ws.py",
    "*/tests/*",
]
